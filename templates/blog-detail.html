<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | Turistični Oglasi</title>
    <meta name="description" content="{{ excerpt }}">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        :root { --primary-color: #2c3e50; --accent-color: #3498db; --text-color: #333; --bg-color: #f4f7f6; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; line-height: 1.8; color: var(--text-color); background-color: var(--bg-color); }
        
        .article-wrap { 
            max-width: 900px; 
            margin: 40px auto; 
            background: #fff; 
            padding: 50px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            border: 1px solid #eee; 
        }
        
        .back-link { 
            color: var(--accent-color); 
            text-decoration: none; 
            font-weight: 700; 
            display: inline-block; 
            margin-bottom: 30px; 
        }
        .back-link:hover { text-decoration: underline; }
        
        .post-meta { 
            font-size: 0.9rem; 
            color: #999; 
            margin-bottom: 15px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }
        
        h1 { 
            font-size: 2.4rem; 
            line-height: 1.2; 
            margin-bottom: 35px; 
            color: var(--primary-color); 
        }
        
        .featured-image { 
            width: 100%; 
            height: 460px; 
            border-radius: 8px; 
            margin-bottom: 45px; 
            overflow: hidden; 
            background: #eee; 
        }
        .featured-image img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }
        
        h3 { 
            font-size: 1.6rem; 
            margin: 40px 0 18px; 
            color: var(--primary-color); 
            border-left: 5px solid var(--accent-color); 
            padding-left: 15px; 
        }
        
        p { 
            margin-bottom: 28px; 
            font-size: 1.12rem; 
            color: #444; 
            text-align: justify; 
        }
        
        .highlight-box { 
            background: #f0f7ff; 
            padding: 32px; 
            border-radius: 8px; 
            border-left: 5px solid var(--accent-color); 
            margin: 35px 0; 
            font-style: italic; 
        }
        
        footer { 
            padding: 60px 0 40px; 
            text-align: center; 
            font-size: 0.85rem; 
            color: #777; 
            border-top: 1px solid #ddd; 
            margin-top: 80px; 
        }
        
        @media (max-width: 600px) { 
            .article-wrap { padding: 30px 20px; } 
            h1 { font-size: 1.9rem; } 
            .featured-image { height: 280px; } 
        }
    </style>
</head>
<body>

<div class="article-wrap">
    <a href="../index.html" class="back-link">← Nazaj na domov</a>
    
    <article>
        <div class="post-meta">{{ date }} | {{ meta or 'Turistični Oglasi' }}</div>
        <h1>{{ title }}</h1>
        
        <!-- FIXED IMAGE PATH -->
        <div class="featured-image">
            <img src="../images/{{ image }}" alt="{{ title }}">
        </div>
        
        <div class="content">
            {{ content | safe }}
        </div>
    </article>
</div>

<footer>
    <p>&copy; 2026 Turistični Oglasi Slovenija. Vse pravice pridržane.</p>
</footer>

</body>
</html>
