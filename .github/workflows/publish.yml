name: Publish Site (Smart Conditional)

on:
  workflow_dispatch:          # Manual "Run workflow" button
  schedule:
    - cron: '0 8 * * *'       # Runs every day at 08:00 UTC (we can change this per site)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install jinja2

      - name: Generate blogs (only if due)
        run: python generate_blogs.py

      - name: Build index.html
        run: python build.py

      - name: Check if there were changes
        id: changes
        run: |
          if git diff --quiet HEAD -- index.html blogs/ images/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No new posts today - skipping commit"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html blogs/ images/ data/posts.json
          git commit -m "Auto-publish: New post(s) added on $(date +'%Y-%m-%d')"
          git push