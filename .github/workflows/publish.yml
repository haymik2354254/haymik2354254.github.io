name: Manual Publish

on:
  workflow_dispatch: # This is what creates the "button"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the bot to save generated HTML back to your repo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

- name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jinja2

      - name: Run Blog Generator
        run: python generate_blogs.py

      - name: Run Index Builder
        run: python build.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add blogs/ images/ data/ index.html
          git commit -m "Automated publish: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
